name: Construir APK de Android

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Java (Requisito para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter (Motor móvil)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Instalar Flet
        run: pip install -r requirements.txt

      - name: Compilar APK
        run: flet build apk --project gestor_academico --product "Gestor Académico"

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-Academico-APK
          path: build/apk/app-release.apk